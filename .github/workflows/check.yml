name: check

on:
  push:
  pull_request:

permissions:
  contents: read

# Builds the scanner from image/ exactly as the lab-builder workflow did for the pinned tag, then
# starts the lab the way the platform's runner does and checks every figure the lessons quote.
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t vuln-lab-scanner:check image
      - run: SCANNER_IMAGE=vuln-lab-scanner:check test/check.sh
